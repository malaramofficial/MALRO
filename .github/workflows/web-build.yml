name: MALRO Web Build
on:
  push:
    paths:
      - 'web/**'
      - '.github/workflows/web-build.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install
      - run: npm run build
        env:
          VITE_APP_ROLE: ${{ github.ref_name == 'web/customer' && 'customer' || github.ref_name == 'web/seller' && 'seller' || github.ref_name == 'web/delivery' && 'delivery' || 'admin' }}
