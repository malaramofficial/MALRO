name: MALRO Admin - Build and Appetize Deploy

on:
  push:
    branches: ["app/admin"]
  workflow_dispatch:
    inputs:
      create_new_app:
        description: "पहली बार Appetize पर नया ऐप बनाएँ"
        required: false
        type: boolean
        default: false

concurrency:
  group: malro-admin-appetize
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      APPETIZE_PUBLIC_KEY: ${{ secrets.APPETIZE_ADMIN_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build MALRO Admin APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK_PATH="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "::error::Debug APK नहीं मिला।"
            exit 1
          fi
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "APK: $APK_PATH"
      - name: Save APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: malro-admin-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
      - name: Require key for normal manual update
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_new_app != true && env.APPETIZE_PUBLIC_KEY == '' }}
        run: |
          echo "::error::पहली बार ऐप बनाने के लिए create_new_app को चुनें। बाद में APPETIZE_ADMIN_KEY Secret सेव करें।"
          exit 1
      - name: Create first app on Appetize
        id: create_app
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_new_app == true }}
        uses: appetizeio/github-action-appetize@v1.1.0
        with:
          apiToken: ${{ secrets.APPETIZE_API_TOKEN }}
          appFile: ${{ steps.apk.outputs.path }}
          platform: android
          note: MALRO Admin
      - name: Update existing app on Appetize
        id: update_app
        if: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_new_app != true)) && env.APPETIZE_PUBLIC_KEY != '' }}
        uses: appetizeio/github-action-appetize@v1.1.0
        with:
          apiToken: ${{ secrets.APPETIZE_API_TOKEN }}
          publicKey: ${{ secrets.APPETIZE_ADMIN_KEY }}
          appFile: ${{ steps.apk.outputs.path }}
          platform: android
          note: MALRO Admin
      - name: Show new Public Key
        if: ${{ steps.create_app.outputs.publicKey != '' }}
        env:
          NEW_PUBLIC_KEY: ${{ steps.create_app.outputs.publicKey }}
        run: |
          echo "## MALRO Admin - पहली डिप्लॉयमेंट" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "नई Public Key: $NEW_PUBLIC_KEY" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "इसे GitHub Repository Secret APPETIZE_ADMIN_KEY में सेव करें।" >> "$GITHUB_STEP_SUMMARY"
      - name: Deployment status
        if: ${{ steps.update_app.outputs.publicKey != '' }}
        run: echo "MALRO Admin का Appetize अपलोड/अपडेट सफल रहा।"
      - name: Explain skipped upload when key is not set yet
        if: ${{ github.event_name == 'push' && env.APPETIZE_PUBLIC_KEY == '' }}
        run: |
          echo "Appetize upload छोड़ा गया: APPETIZE_ADMIN_KEY Secret पहली बार ऐप बनने के बाद जोड़ना है।"
          echo "APK artifact सफलतापूर्वक बनाया गया है।"
